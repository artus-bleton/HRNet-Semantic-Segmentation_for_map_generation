# param_grid.yaml

state_type: final_state.pth

loss_list:
    - dice

batch_size_list:
    - 32

lr_list:
    - 0.0005

# Must be in order (VERY IMPORTANT)
# because the 20 epochs training uses the 10 epoch training's model as starting model
epochs:
    - 10
    - 20
    - 30
    - 40

# must be floats
px_size:
    - 1.5
    - 2.5
    - 3.0
